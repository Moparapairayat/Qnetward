# Render Blueprint: the whole app as one Docker web service, with a Render
# Postgres database. Setup and caveats of the free plan: docs/deploy-render.md
#
# A free Render database expires 30 days after it's created and is deleted
# 14 days later with all its data. Use it for short tests and demos only.
databases:
  - name: qnetward-db
    plan: free
    region: singapore
    databaseName: qnetward
    user: qnetward
    # Migration 0005 grants SET on the tenant role, which needs PostgreSQL 16+.
    postgresMajorVersion: "16"

services:
  - type: web
    name: qnetward
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Secrets: Render asks for these when the Blueprint is created.
      - key: QNETWARD_DB_DSN
        fromDatabase:
          name: qnetward-db
          property: connectionString
      - key: QNETWARD_ENCRYPTION_KEY
        sync: false
      - key: QNETWARD_PUBLIC_BASE_URL
        sync: false
      - key: QNETWARD_RESEND_API_KEY
        sync: false
      - key: QNETWARD_EMAIL_FROM
        sync: false
      - key: QNETWARD_ADMIN_EMAILS
        sync: false
      # Optional: a free NVD key makes vulnerability lookups ten times faster.
      - key: QNETWARD_NVD_API_KEY
        sync: false
      # The free database allows few connections; keep the pool small.
      - key: QNETWARD_DB_MAX_OPEN
        value: "5"
      - key: QNETWARD_DB_MAX_IDLE
        value: "2"
      - key: QNETWARD_DEMO_ENABLED
        value: "true"
      - key: QNETWARD_DEMO_NAME
        value: Mopara Pair Ayat
      - key: QNETWARD_DEMO_EMAIL
        value: demo@qnetward.com
      - key: QNETWARD_DEMO_WORKSPACE
        value: Kestrel Labs
