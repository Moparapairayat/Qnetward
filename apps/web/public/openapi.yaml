            type: number
          locations:
            type: array
            description: The places the monitor runs from, each with its latest result.
            items:
              type: object
              properties:
                agent_id:
                  type: integer
                  description: 0 for Qnetward's servers.
                name:
                  type: string
                status:
                  type: string
                  enum:
                  - pending
                  - up
                  - down
                last_checked_at:
                  type: string
                  format: date-time
                last_rtt_ms:
                  type: number
