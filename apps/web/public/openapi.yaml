openapi: 3.1.0
info:
  title: Qnetward API
  version: "1.0"
  summary: Monitoring, diagnostics, infrastructure, and security scanning for one workspace.
  description: |
    Everything you can do in the Qnetward console, from scripts, CI, and Terraform.

    ## Authentication

    Create a key under **Workspace settings → API keys** (owners and admins) and send it
    with every request:

    ```bash
    curl -H "Authorization: Bearer qnw_…" https://your-console/api/monitors
    ```

    A key acts in the workspace it belongs to, with the scopes you gave it:

    - **`read`**: every `GET`, and history export.
    - **`write`**: creating, changing, and deleting monitors, rules, watches, and devices.
    - **`probe`**: running ping, TCP ping, port scans, DNS lookups, and scans.

    ## Conventions

    - Requests and responses are JSON. Times are RFC 3339 in UTC.
    - Errors are JSON objects with an `error` message and a fitting HTTP status:
      `400` bad input, `401` no or bad key, `403` missing scope or role,
      `404` not found, `409` a plan limit or a conflict, `429` too many requests.
    - Targets in private and cloud-metadata ranges are refused on the hosted service.
      Probe agents reach private networks instead.
servers:
  - url: https://console.qnetward.com
    description: Hosted service
security:
  - apiKey: []
tags:
  - name: Diagnostics
    description: One-off ping, TCP ping, port scans, DNS lookups, and traceroute.
  - name: Monitors
    description: Uptime checks that run on a schedule from the cloud or your agents.
  - name: Alert rules
    description: Latency and packet loss rules on diagnostics targets.
  - name: History
    description: Stored samples and exports.
  - name: Status pages
    description: Public pages that show your monitors' health.
  - name: Infrastructure
    description: Hosts and network devices reported by your agents, and their alert rules.
  - name: Security
    description: Passive checks, verified domains, attack surface scans, vulnerabilities, deep scans, and compliance.
paths:
  /api/ping:
    post:
      tags: [Diagnostics]
      summary: Run an ICMP ping
      description: "Needs the `probe` scope. Samples are stored in history."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host]
              properties:
                host: { type: string, example: 1.1.1.1 }
                count: { type: integer, minimum: 1, maximum: 100, default: 5 }
                interval_ms: { type: integer, default: 1000 }
                timeout_ms: { type: integer, default: 2000 }
                size: { type: integer, description: Payload size in bytes }
                ipv6: { type: boolean, default: false }
      responses:
        "200": { $ref: "#/components/responses/Report" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/tcpping:
    post:
      tags: [Diagnostics]
      summary: Run a TCP ping
      description: "Needs the `probe` scope. Measures TCP handshake time to a port."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host, port]
              properties:
                host: { type: string, example: db.example.com }
                port: { type: integer, minimum: 1, maximum: 65535, example: 5432 }
                count: { type: integer, minimum: 1, maximum: 100, default: 5 }
                interval_ms: { type: integer, default: 1000 }
                timeout_ms: { type: integer, default: 2000 }
      responses:
        "200": { $ref: "#/components/responses/Report" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/portscan:
    post:
      tags: [Diagnostics]
      summary: Scan TCP ports
      description: "Needs the `probe` scope. Every scan is recorded in the workspace audit log."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host, ports]
              properties:
                host: { type: string, example: scanme.nmap.org }
                ports: { type: string, description: "Comma-separated ports and ranges, up to 4,096 ports.", example: "22,80,443,8000-8010" }
                timeout_ms: { type: integer }
                concurrency: { type: integer, maximum: 256 }
      responses:
        "200": { $ref: "#/components/responses/Report" }
        "400": { $ref: "#/components/responses/Error" }
  /api/dnslookup:
    post:
      tags: [Diagnostics]
      summary: Look up DNS records
      description: "Needs the `probe` scope."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: { type: string, example: example.com }
                record_type: { type: string, example: ALL, description: "A record type such as A, AAAA, MX, TXT, or ALL." }
                resolver: { type: string, example: cloudflare, description: "system, cloudflare, google, quad9, or an IP address." }
                timeout_ms: { type: integer }
      responses:
        "200":
          description: Records found, with DNSSEC and mail checks.
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/Error" }
  /api/security/passive:
    post:
      tags: [Security]
      summary: Run a passive check of a domain
      description: "Needs the `probe` scope. Grades the domain from public signals only: its TLS certificate and versions, its website's security headers, and its SPF, DMARC, CAA, and DNSSEC records. Counts towards the hourly scan quota, and the same domain can be checked 12 times an hour per workspace. Recorded in the audit log."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string, example: example.com, description: A domain, or a URL whose host is used. IP addresses are refused. }
      responses:
        "201":
          description: The saved scan, with its full report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityScan" }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    get:
      tags: [Security]
      summary: List passive checks, or get one
      description: "Needs the `read` scope. With id, returns that scan with its report; otherwise the newest scans without reports, optionally for one domain."
      parameters:
        - { name: id, in: query, schema: { type: integer } }
        - { name: domain, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200, default: 50 } }
      responses:
        "200":
          description: A scan, or { scans }.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityScan" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Security]
      summary: Delete a passive check
      description: "Needs the `write` scope."
      parameters:
        - { name: id, in: query, required: true, schema: { type: integer } }
      responses:
        "200": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }
  /api/security/watches:
    get:
      tags: [Security]
      summary: List watched domains
      description: "Needs the `read` scope. Returns { watches, limit, intervals }."
      responses:
        "200": { description: The workspace's watched domains. }
    post:
      tags: [Security]
      summary: Watch a domain, or change a watch
      description: "Needs the `write` scope. A watched domain's passive check re-runs every interval_hours (6, 24, or 168). It alerts by email and on channels subscribed to `security` when the grade drops or a new high-severity issue appears."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer, description: Set to change an existing watch. }
                kind: { type: string, enum: [passive, surface], default: passive, description: "surface schedules attack surface scans; the domain must be verified, and the interval is 24 or 168 hours (168 by default)." }
                domain: { type: string, example: example.com }
                interval_hours: { type: integer, enum: [6, 24, 168], default: 24 }
                notify_email: { type: string }
                enabled: { type: boolean, default: true }
      responses:
        "201": { description: Watching. }
        "200": { description: Updated. }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Security]
      summary: Stop watching a domain
      description: "Needs the `write` scope. Past scans stay."
      parameters:
        - { name: id, in: query, required: true, schema: { type: integer } }
      responses:
        "200": { description: Stopped. }
        "404": { $ref: "#/components/responses/Error" }
  /api/security/surface:
    post:
      tags: [Security]
      summary: Start an attack surface scan of a verified domain
      description: "Needs the `probe` scope. The domain, or the domain it is under, must be verified in Assets. Answers 202 with a running scan; poll GET ?id= until status is done or failed. One scan at a time per workspace; Free 2, Pro 10, Enterprise 50 an hour."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string, example: example.com }
      responses:
        "202": { description: The scan, running. }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
    get:
      tags: [Security]
      summary: List attack surface scans, or get one
      description: "Needs the `read` scope. With id, the scan with its report: hosts (name, source, addresses, open_ports, certificate) and findings, each naming its host."
      parameters:
        - { name: id, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: "A scan, or { scans }." }
    delete:
      tags: [Security]
      summary: Delete an attack surface scan
      parameters:
        - { name: id, in: query, required: true, schema: { type: integer } }
      responses:
        "200": { description: Deleted. }
  /api/hosts:
    get:
      tags: [Infrastructure]
      summary: List hosts, or one host's history
      description: "Needs the `read` scope. Without `id`, lists enrolled agents with their machine description and newest sample (CPU, load, memory, swap, disks, network, processes, uptime). With `id` and `range` (1h, 6h, 24h, 7d, 14d), returns averaged points: cpu, cpu_max, load1, mem_pct, swap_pct, disk_pct (fullest disk), net_rx_bps, net_tx_bps, procs."
      parameters:
        - { name: id, in: query, required: false, schema: { type: integer } }
        - { name: range, in: query, required: false, schema: { type: string, enum: ["1h", "6h", "24h", "7d", "14d"] } }
      responses:
        "200": { description: "{ hosts, metrics_seconds } or { points, range, bucket_seconds }" }
  /api/hosts/alerts:
    get:
      tags: [Infrastructure]
      summary: List host alert rules and where they fire
      responses:
        "200": { description: "{ rules, limit }" }
    post:
      tags: [Infrastructure]
      summary: Create or update a host alert rule
      description: "Needs the `write` scope. Fires when every sample in the last `minutes` is at or above `threshold` percent; clears when every sample is below."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [metric, threshold, minutes]
              properties:
                id: { type: integer, description: "Omit to create." }
                agent_id: { type: integer, nullable: true, description: "Null for every host." }
                metric: { type: string, enum: [cpu, memory, disk, swap] }
                threshold: { type: number, minimum: 1, maximum: 100 }
                minutes: { type: integer, minimum: 1, maximum: 60 }
                notify_email: { type: string }
                enabled: { type: boolean }
      responses:
        "201": { description: The new rule. }
        "200": { description: The updated rule. }
    delete:
      tags: [Infrastructure]
      summary: Delete a host alert rule
      parameters:
        - { name: id, in: query, required: true, schema: { type: integer } }
      responses:
        "200": { description: Deleted. }
  /api/devices:
    get:
      tags: [Infrastructure]
      summary: List network devices, or one device's history
      description: "Needs the `read` scope. Without `id`, lists devices with status, system info, and interfaces (credentials are never returned). With `id` and `range` (1h, 6h, 24h, 7d), returns traffic points; add `if` for one interface."
      parameters:
        - { name: id, in: query, required: false, schema: { type: integer } }
        - { name: range, in: query, required: false, schema: { type: string, enum: ["1h", "6h", "24h", "7d"] } }
        - { name: if, in: query, required: false, schema: { type: integer }, description: "Interface index." }
      responses:
        "200": { description: "{ devices, limit } or { points, range, bucket_seconds }" }
    post:
      tags: [Infrastructure]
      summary: Add or update a network device
      description: "Needs the `write` scope and an owner or admin. Give `community` for v2c, or `username`, `auth_protocol` (none, md5, sha, sha256, sha512), `auth_password`, `priv_protocol` (none, des, aes, aes256), `priv_password` for v3. On update, leave credentials out to keep them."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address, version]
              properties:
                id: { type: integer }
                agent_id: { type: integer, nullable: true }
                name: { type: string }
                address: { type: string, example: 10.0.0.2 }
                port: { type: integer, default: 161 }
                version: { type: string, enum: ["2c", "3"] }
                interval_seconds: { type: integer, minimum: 30, maximum: 3600 }
                enabled: { type: boolean }
      responses:
        "201": { description: The new device. }
        "200": { description: The updated device. }
    delete:
      tags: [Infrastructure]
      summary: Remove a network device and its history
      parameters:
        - { name: id, in: query, required: true, schema: { type: integer } }
      responses:
        "200": { description: Removed. }
  /api/security/compliance:
    get:
      tags: [Security]
      summary: Map scan results to compliance controls
      description: "Needs the `read` scope. Evaluates externally observable controls from each domain's newest passive, attack surface, and deep scan of the last 30 days, plus verified domains, schedules, and monitors. Each control has a status (pass, warn, fail, not_assessed), evidence, and references to CIS Controls v8, PCI DSS 4.0, ISO/IEC 27001:2022 Annex A, and SOC 2. Evidence for an audit, not a certification."
      parameters:
        - { name: format, in: query, required: false, schema: { type: string, enum: [csv] }, description: "csv returns the same as a spreadsheet." }
      responses:
        "200": { description: "{ frameworks, controls, counts, sources, window_days, checked_at }, or text/csv" }
  /api/security/vulnerabilities:
    get:
      tags: [Security]
      summary: List known vulnerabilities across verified domains
      description: "Needs the `read` scope. From each domain's latest attack surface scan: CVE, severity (critical/high/medium/low), CVSS, kev (exploited in the wild), epss, host, port, product, version, and the workspace's decision if any. Matched from announced versions, so distributions' backported fixes show as false positives."
      responses:
        "200": { description: "{ vulns, domains }" }
  /api/security/vulnerabilities/decisions:
    post:
      tags: [Security]
      summary: Accept a risk or mark a false positive
      description: "Needs the `write` scope and an owner or admin."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host, cve, status]
              properties:
                host: { type: string }
                cve: { type: string, example: CVE-2021-23017 }
                status: { type: string, enum: [accepted, false_positive] }
                reason: { type: string, maxLength: 500 }
      responses:
        "200": { description: The decision. }
    delete:
      tags: [Security]
      summary: Reopen a vulnerability
      parameters:
        - { name: id, in: query, required: true, schema: { type: integer } }
      responses:
        "200": { description: Reopened. }
  /api/security/deep:
    get:
      tags: [Security]
      summary: List deep scan requests
      description: "Needs the `read` scope. Returns { requests, per_month, windows, checks }."
      responses:
        "200": { description: The workspace's requests. }
    post:
      tags: [Security]
      summary: Preview or submit a signed deep scan request
      description: "Needs the `write` scope, an owner or admin, and a Pro or Enterprise plan. With ?preview=1, returns the authorization text and its SHA-256 for the given scope and name. Without it, submits: send the same fields plus consent_hash and accept=true; the server rebuilds the text and refuses a different hash. The request waits for a Qnetward admin's approval and runs only inside its window."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, window_hours, name]
              properties:
                domain: { type: string }
                hosts: { type: array, items: { type: string }, maxItems: 20 }
                checks: { type: array, items: { type: string, enum: [exposed_files] } }
                window_start: { type: string, format: date-time }
                window_hours: { type: integer, enum: [24, 72, 168] }
                name: { type: string, description: The signer's full name. }
                consent_hash: { type: string }
                accept: { type: boolean }
      responses:
        "200": { description: "Preview: { text, hash, version, input }." }
        "201": { description: The request, pending review. }
        "402": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Security]
      summary: Withdraw a request that hasn't started
      parameters:
        - { name: id, in: query, required: true, schema: { type: integer } }
      responses:
        "200": { description: Withdrawn. }
        "409": { $ref: "#/components/responses/Error" }
  /api/assets/domains:
    get:
      tags: [Security]
      summary: List the workspace's domains and their verification
      description: "Needs the `read` scope. Each domain carries its token, the TXT record name, and the proof file URL."
      responses:
        "200": { description: "{ domains, limit }" }
    post:
      tags: [Security]
      summary: Add a domain to verify
      description: "Needs the `write` scope and an owner or admin. Returns the token to publish as a TXT record at record_name or in the file at file_url."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string, example: example.com }
      responses:
        "201": { description: The domain, pending verification. }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Security]
      summary: Remove a domain
      parameters:
        - { name: id, in: query, required: true, schema: { type: integer } }
      responses:
        "200": { description: Removed. }
        "404": { $ref: "#/components/responses/Error" }
  /api/assets/domains/verify:
    post:
      tags: [Security]
      summary: Look for a domain's proof now
      description: "Needs the `write` scope and an owner or admin. 60 attempts a workspace per hour."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer }
      responses:
        "200": { description: "The domain; status is verified when the proof was found, with last_error saying what was seen when not." }
        "429": { $ref: "#/components/responses/Error" }
  /api/monitors:
    get:
      tags: [Monitors]
      summary: List monitors
      description: "Needs the `read` scope. Includes 24-hour uptime and the last 30 checks."
      responses:
        "200":
          description: The workspace's monitors.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Monitor" }
    post:
      tags: [Monitors]
      summary: Create or update a monitor
      description: "Needs the `write` scope. Send `id` to update an existing monitor."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitorInput" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Monitor" } } } }
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Monitor" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Monitors]
      summary: Delete a monitor
      description: "Needs the `write` scope."
      parameters:
        - { name: id, in: query, required: true, schema: { type: integer } }
      responses:
        "200": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /api/monitors/series:
    get:
      tags: [Monitors]
      summary: Response time per monitor over a window
      description: "Needs the `read` scope. Checks are returned raw for 15m and 1h, and averaged into buckets for 6h (2 minutes) and 24h (10 minutes)."
      parameters:
        - { name: window, in: query, schema: { type: string, enum: [15m, 1h, 6h, 24h], default: 1h } }
      responses:
        "200":
          description: Each monitor with its points in the window.
          content:
            application/json:
              schema:
                type: object
                properties:
                  window: { type: string }
                  now: { type: integer, description: Server time, Unix milliseconds. }
                  span_ms: { type: integer }
                  bucket_seconds: { type: integer, description: 1 when points are single checks. }
                  monitors:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        protocol: { type: string, enum: [ping, tcpping, http] }
                        target: { type: string }
                        port: { type: integer }
                        interval_seconds: { type: integer }
                        enabled: { type: boolean }
                        status: { type: string, enum: [pending, up, down] }
                        points:
                          type: array
                          items:
                            type: object
                            properties:
                              t: { type: integer, description: Slot start, Unix milliseconds. }
                              rtt_ms: { type: number, description: Average of the checks that succeeded. Absent when all failed. }
                              failed: { type: integer }
                              checks: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
  /api/status-pages:
    get:
      tags: [Status pages]
      summary: List status pages
      description: "Needs the `read` scope."
      responses:
        "200": { description: "The workspace's pages and the plan's page limit." }
    post:
      tags: [Status pages]
      summary: Create or update a status page
      description: "Needs the `write` scope. Send `id` to update. Monitors from other workspaces are ignored."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, title]
              properties:
                id: { type: integer }
                slug: { type: string, description: "3 to 40 lowercase letters, numbers, or single hyphens; the page lives at /status/<slug>." }
                title: { type: string }
                description: { type: string }
                published: { type: boolean }
                monitors:
                  type: array
                  items:
                    type: object
                    properties:
                      monitor_id: { type: integer }
                      label: { type: string, description: "The name visitors see; the monitor's own name when empty." }
      responses:
        "200": { description: Updated }
        "201": { description: Created }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Status pages]
      summary: Delete a status page
      description: "Needs the `write` scope."
      parameters:
        - { name: id, in: query, required: true, schema: { type: integer } }
      responses:
        "200": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /api/public/status/{slug}:
    get:
      tags: [Status pages]
      summary: A published status page
      description: "No authentication. Shows display names and outcomes only, never monitor targets. Cached for 30 seconds."
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "The page, its overall status (operational, degraded, outage, or unknown), and daily checks per service for the last 30 days." }
        "404": { $ref: "#/components/responses/Error" }
  /api/alerts/rules:
    get:
      tags: [Alert rules]
      summary: List alert rules
      description: "Needs the `read` scope."
      responses:
        "200":
          description: The workspace's alert rules.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlertRule" }
    post:
      tags: [Alert rules]
      summary: Create or update an alert rule
      description: "Needs the `write` scope. Set a latency threshold, a loss threshold, or both. Send `id` to update."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertRuleInput" }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/AlertRule" } } } }
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/AlertRule" } } } }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Alert rules]
      summary: Delete an alert rule
      description: "Needs the `write` scope."
      parameters:
        - { name: id, in: query, required: true, schema: { type: integer } }
      responses:
        "200": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /api/history:
    get:
      tags: [History]
      summary: Samples for one target
      description: "Needs the `read` scope. Oldest first."
      parameters:
        - { name: type, in: query, required: true, schema: { type: string, enum: [ping, tcpping] } }
        - { name: host, in: query, required: true, schema: { type: string } }
        - { name: port, in: query, schema: { type: integer }, description: Required for tcpping. }
        - { name: limit, in: query, schema: { type: integer, maximum: 1000, default: 120 } }
      responses:
        "200":
          description: Stored samples.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HistoryPoint" }
  /api/history/recent-targets:
    get:
      tags: [History]
      summary: Recently probed targets
      description: "Needs the `read` scope."
      parameters:
        - { name: limit, in: query, schema: { type: integer, maximum: 50, default: 12 } }
      responses:
        "200":
          description: Targets, most recent first.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    protocol: { type: string }
                    target: { type: string }
                    port: { type: integer }
                    last_sample_at: { type: integer, description: Unix milliseconds }
  /api/export/history:
    post:
      tags: [History]
      summary: Export samples as CSV or JSON
      description: "Needs the `read` scope. Recorded in the audit log."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, host]
              properties:
                type: { type: string, enum: [ping, tcpping] }
                host: { type: string }
                port: { type: integer }
                limit: { type: integer, maximum: 1000 }
                format: { type: string, enum: [csv, json], default: json }
      responses:
        "200":
          description: The export file.
          content:
            application/json: { schema: { type: array, items: { $ref: "#/components/schemas/HistoryPoint" } } }
            text/csv: { schema: { type: string } }
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: A workspace API key, beginning with `qnw_`.
  responses:
    Error:
      description: The request failed.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    Report:
      description: The run's results and summary.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Report" }
  schemas:
    Report:
      type: object
      properties:
        protocol: { type: string }
        target: { type: string }
        addr: { type: string }
        port: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              seq: { type: integer }
              port: { type: integer }
              state: { type: string, description: "Port scans: open, closed, or timeout." }
              rtt: { type: string, example: 18.2ms }
              rtt_ms: { type: number }
              error: { type: string }
              addr: { type: string }
        summary:
          type: object
          properties:
            sent: { type: integer }
            recv: { type: integer }
            loss: { type: number, description: Percent }
            min: { type: string }
            avg: { type: string }
            max: { type: string }
            median: { type: string }
            stddev: { type: string }
            jitter: { type: string }
            scanned: { type: integer }
            open: { type: integer }
            closed: { type: integer }
            timeout: { type: integer }
            duration: { type: string }
    HistoryPoint:
      type: object
      properties:
        ts: { type: integer, description: Unix milliseconds }
        seq: { type: integer }
        rtt_ms: { type: number }
        error: { type: string }
    SecurityScan:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string, enum: [passive, surface] }
        status: { type: string, enum: [running, done, failed] }
        error: { type: string }
        domain: { type: string }
        grade: { type: string, enum: [A+, A, B, C, D, F] }
        score: { type: integer, minimum: 0, maximum: 100 }
        high: { type: integer }
        medium: { type: integer }
        low: { type: integer }
        created_at: { type: string, format: date-time }
        report:
          type: object
          description: "The full report: findings (id, category tls/http/email/dns, severity high/medium/low/info/pass, title, detail, fix), and what was seen of TLS, HTTP headers, and DNS."
    MonitorInput:
      type: object
      required: [protocol, target, interval_seconds]
      properties:
        id: { type: integer, description: Set to update an existing monitor. }
        name: { type: string, maxLength: 80 }
        protocol: { type: string, enum: [http, tcpping, ping] }
        target: { type: string, description: "A URL for http, otherwise a host name or IP.", example: https://api.example.com/health }
        port: { type: integer, description: Required for tcpping. }
        interval_seconds: { type: integer, enum: [30, 60, 300, 600, 1800, 3600] }
        expected_status: { type: integer, description: "http only. Without it, any 2xx or 3xx is up." }
        notify_email: { type: string, description: Emailed when the monitor goes down or comes back. Empty for none. }
        enabled: { type: boolean, default: true }
        locations:
          type: array
          items: { type: integer }
          description: "Where to run from: 0 for Qnetward's servers, or probe agent ids. Left out, a new monitor runs from the servers and an existing one keeps its places. With several, the monitor is down only when every place still reporting sees it down."
        agent_id: { type: integer, deprecated: true, description: "Use locations. Runs the monitor from this one probe agent, or the servers when 0." }
    Monitor:
      allOf:
        - $ref: "#/components/schemas/MonitorInput"
        - type: object
          properties:
            status: { type: string, enum: [pending, up, down] }
            last_checked_at: { type: string, format: date-time }
            last_status_change_at: { type: string, format: date-time }
            last_rtt_ms: { type: number }
            last_status_code: { type: integer }
            last_error: { type: string }
            tls_expires_at: { type: string, format: date-time }
            next_run_at: { type: string, format: date-time }
            uptime_24h: { type: number }
            locations:
              type: array
              description: The places the monitor runs from, each with its latest result.
              items:
                type: object
                properties:
                  agent_id: { type: integer, description: 0 for Qnetward's servers. }
                  name: { type: string }
                  status: { type: string, enum: [pending, up, down] }
                  last_checked_at: { type: string, format: date-time }
                  last_rtt_ms: { type: number }
                  last_error: { type: string }
                  online: { type: boolean, description: False for an agent that stopped checking in. Its result no longer counts. }
            recent_checks:
              type: array
              items:
                type: object
                properties:
                  checked_at: { type: string, format: date-time }
                  ok: { type: boolean }
                  rtt_ms: { type: number }
                  loss_percent: { type: number }
                  status_code: { type: integer }
                  error: { type: string }
                  agent_id: { type: integer, description: The probe agent that ran the check. Absent when the server did. }
    AlertRuleInput:
      type: object
      required: [protocol, target]
      properties:
        id: { type: integer, description: Set to update an existing rule. }
        name: { type: string }
        protocol: { type: string, enum: [ping, tcpping] }
        target: { type: string }
        port: { type: integer, description: Required for tcpping. }
        recipient_email: { type: string }
        latency_threshold_ms: { type: number }
        loss_threshold_percent: { type: number }
        consecutive_breaches: { type: integer, minimum: 1, maximum: 20, default: 1 }
        cooldown_minutes: { type: integer, minimum: 1, maximum: 1440, default: 30 }
        notify_on_recovery: { type: boolean, default: true }
        enabled: { type: boolean, default: true }
    AlertRule:
      allOf:
        - $ref: "#/components/schemas/AlertRuleInput"
        - type: object
          properties:
            last_state: { type: string, enum: [healthy, alert] }
            current_breach_streak: { type: integer }
            last_triggered_at: { type: string, format: date-time }
            last_recovered_at: { type: string, format: date-time }
            last_evaluated_at: { type: string, format: date-time }
            created_at: { type: string, format: date-time }
