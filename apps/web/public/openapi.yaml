  /api/monitors/series:
    get:
      tags:
      - Monitors
      summary: Response time per monitor over a window
      description: Needs the `read` scope. Checks are returned raw for 15m and 1h, and averaged into buckets for 6h (2 minutes) and 24h (10 minutes).
      parameters:
      - name: window
        in: query
        schema:
          type: string
          enum:
          - 15m
          - 1h
          - 6h
          - 24h
          default: 1h
      responses:
        '200':
          description: Each monitor with its points in the window.
          content:
            application/json:
              schema:
                type: object
                properties:
                  window:
                    type: string
                  now:
                    type: integer
                    description: Server time
                    Unix milliseconds.: null
                  span_ms:
                    type: integer
                  bucket_seconds:
                    type: integer
                    description: 1 when points are single checks.
                  monitors:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        protocol:
                          type: string
                          enum:
                          - ping
                          - tcpping
                          - http
                        target:
                          type: string
                        port:
                          type: integer
                        interval_seconds:
                          type: integer
                        enabled:
                          type: boolean
                        status:
                          type: string
                          enum:
                          - pending
                          - up
                          - down
                        points:
                          type: array
                          items:
                            type: object
                            properties:
                              t:
                                type: integer
                                description: Slot start
                                Unix milliseconds.: null
                              rtt_ms:
                                type: number
                                description: Average of the checks that succeeded. Absent when all failed.
                              failed:
                                type: integer
                              checks:
                                type: integer
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: getMonitorsSeries
