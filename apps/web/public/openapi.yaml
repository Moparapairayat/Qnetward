    MonitorInput:
      type: object
      required:
      - protocol
      - target
      - interval_seconds
      properties:
        id:
          type: integer
          description: Set to update an existing monitor.
        name:
          type: string
          maxLength: 80
        protocol:
          type: string
          enum:
          - http
          - tcpping
          - ping
        target:
          type: string
          description: A URL for http, otherwise a host name or IP.
          example: https://api.example.com/health
        port:
          type: integer
          description: Required for tcpping.
        interval_seconds:
          type: integer
          enum:
          - 30
          - 60
          - 300
          - 600
          - 1800
          - 3600
        expected_status:
          type: integer
          description: http only. Without it, any 2xx or 3xx is up.
        notify_email:
          type: string
          description: Emailed when the monitor goes down or comes back. Empty for none.
        enabled:
          type: boolean
          default: true
        locations:
          type: array
          items:
            type: integer
          description: 'Where to run from: 0 for Qnetward''s servers, or probe agent ids. Left out, a new monitor runs from the servers and an
            existing one keeps its places. With several, the monitor is down only when every place still reporting sees it down.'
        agent_id:
          type: integer
          deprecated: true
          description: Use locations. Runs the monitor from this one probe agent, or the servers when 0.
    Monitor:
