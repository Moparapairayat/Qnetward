openapi: 3.1.0
info:
  title: Qnetward API
  version: '1.0'
  summary: Monitoring, diagnostics, infrastructure, and security scanning for one workspace.
  description: |
    Everything you can do in the Qnetward console, from scripts, CI, and Terraform.

    ## Authentication

    Create a key under **Workspace settings → API keys** (owners and admins) and send it
    with every request:

    ```bash
    curl -H "Authorization: Bearer qnw_…" https://your-console/api/monitors
    ```

    A key acts in the workspace it belongs to, with the scopes you gave it:

    - **`read`**: every `GET`, and history export.
    - **`write`**: creating, changing, and deleting monitors, rules, watches, and devices.
    - **`probe`**: running ping, TCP ping, port scans, DNS lookups, and scans.

    ## Conventions

    - Requests and responses are JSON. Times are RFC 3339 in UTC.
    - Errors are JSON objects with an `error` message and a fitting HTTP status:
      `400` bad input, `401` no or bad key, `403` missing scope or role,
      `404` not found, `409` a plan limit or a conflict, `429` too many requests.
    - Targets in private and cloud-metadata ranges are refused on the hosted service.
      Probe agents reach private networks instead.

    ## Rate limits

    Each workspace can make a number of API calls per minute that depends on its plan
    (120 on Free, 600 on Pro, 3,000 on Enterprise). Probes and scans also have hourly
    quotas. Over a limit, you get `429 Too Many Requests` with a `Retry-After` header
    in seconds; wait that long and try again.

    ## Errors

    Every error is a JSON object with one field, written to be shown to a person:

    ```json
    { "error": "this plan's network device limit is reached" }
    ```

    ## Webhooks

    Alert channels of the **Webhook** kind receive a `POST` with this JSON body:

    ```json
    {
      "event": "host.alert",
      "severity": "critical",
      "title": "db-1: Disk at 93%",
      "summary": "Disk on db-1 has been at or above 90% for 5 minutes; it's at 93% now.",
      "target": "db-1 (db-1.internal)",
      "url": "https://your-console/hosts",
      "triggered_at": "2026-11-12T10:07:00Z"
    }
    ```

    Each request carries `X-Qnetward-Event`, `X-Qnetward-Timestamp` (Unix seconds), and,
    when the channel has a secret, `X-Qnetward-Signature`: `sha256=` followed by the hex
    HMAC-SHA256 of the timestamp, a dot, and the raw body. Check it before trusting the
    payload, and refuse timestamps more than five minutes old:

    ```js
    import crypto from "node:crypto";

    function verify(secret, timestamp, rawBody, signature) {
      const mac = crypto.createHmac("sha256", secret).update(`${timestamp}.`).update(rawBody).digest("hex");
      const fresh = Math.abs(Date.now() / 1000 - Number(timestamp)) < 300;
      return fresh && crypto.timingSafeEqual(Buffer.from(`sha256=${mac}`), Buffer.from(signature));
    }
    ```
servers:
- url: https://console.qnetward.com
  description: Hosted service
security:
- apiKey: []
tags:
- name: Diagnostics
  description: One-off ping, TCP ping, port scans, DNS lookups, and traceroute.
- name: Monitors
  description: Uptime checks that run on a schedule from the cloud or your agents.
- name: Alert rules
  description: Latency and packet loss rules on diagnostics targets.
- name: History
  description: Stored samples and exports.
- name: Status pages
  description: Public pages that show your monitors' health.
- name: Hosts
  description: CPU, memory, disk, and network of machines running an agent.
- name: Host alerts
  description: Rules that fire when a host stays busy or full.
- name: Network devices
  description: Routers, switches, and firewalls your agents poll over SNMP.
- name: Passive checks
  description: 'Grade a domain from public signals: TLS, headers, email, and DNS.'
- name: Watched domains
  description: Re-check domains on a schedule and alert when they get worse.
- name: Domains
  description: Prove you control a domain before deeper scans.
- name: Attack surface
  description: Discover subdomains and exposed services on verified domains.
- name: Vulnerabilities
  description: Known CVEs in the software your hosts announce.
- name: Deep scans
  description: Tier 2 checks that need signed consent and an admin's approval.
- name: Compliance
  description: Scan evidence mapped to CIS, PCI DSS, ISO 27001, and SOC 2.
paths:
  /api/ping:
    post:
      tags:
      - Diagnostics
      summary: Run an ICMP ping
      description: Needs the `probe` scope. Samples are stored in history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - host
              properties:
                host:
                  type: string
                  example: 1.1.1.1
                count:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 5
                interval_ms:
                  type: integer
                  default: 1000
                timeout_ms:
                  type: integer
                  default: 2000
                size:
                  type: integer
                  description: Payload size in bytes
                ipv6:
                  type: boolean
                  default: false
      responses:
        '200':
          $ref: '#/components/responses/Report'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      operationId: postPing
  /api/tcpping:
    post:
      tags:
      - Diagnostics
      summary: Run a TCP ping
      description: Needs the `probe` scope. Measures TCP handshake time to a port.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - host
              - port
              properties:
                host:
                  type: string
                  example: db.example.com
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  example: 5432
                count:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 5
                interval_ms:
                  type: integer
                  default: 1000
                timeout_ms:
                  type: integer
                  default: 2000
      responses:
        '200':
          $ref: '#/components/responses/Report'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: postTcpping
  /api/portscan:
    post:
      tags:
      - Diagnostics
      summary: Scan TCP ports
      description: Needs the `probe` scope. Every scan is recorded in the workspace audit log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - host
              - ports
              properties:
                host:
                  type: string
                  example: scanme.nmap.org
                ports:
                  type: string
                  description: Comma-separated ports and ranges, up to 4,096 ports.
                  example: 22,80,443,8000-8010
                timeout_ms:
                  type: integer
                concurrency:
                  type: integer
                  maximum: 256
      responses:
        '200':
          $ref: '#/components/responses/Report'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: postPortscan
  /api/dnslookup:
    post:
      tags:
      - Diagnostics
      summary: Look up DNS records
      description: Needs the `probe` scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - target
              properties:
                target:
                  type: string
                  example: example.com
                record_type:
                  type: string
                  example: ALL
                  description: A record type such as A, AAAA, MX, TXT, or ALL.
                resolver:
                  type: string
                  example: cloudflare
                  description: system, cloudflare, google, quad9, or an IP address.
                timeout_ms:
                  type: integer
      responses:
        '200':
          description: Records found, with DNSSEC and mail checks.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: postDnslookup
  /api/security/passive:
    post:
      tags:
      - Passive checks
      summary: Run a passive check of a domain
      description: 'Needs the `probe` scope. Grades the domain from public signals only: its TLS certificate and versions, its website''s security
        headers, and its SPF, DMARC, CAA, and DNSSEC records. Counts towards the hourly scan quota, and the same domain can be checked 12 times
        an hour per workspace. Recorded in the audit log.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - domain
              properties:
                domain:
                  type: string
                  example: example.com
                  description: A domain
                  or a URL whose host is used. IP addresses are refused.: null
      responses:
        '201':
          description: The saved scan, with its full report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityScan'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      operationId: postSecurityPassive
    get:
      tags:
      - Passive checks
      summary: List passive checks, or get one
      description: Needs the `read` scope. With id, returns that scan with its report; otherwise the newest scans without reports, optionally
        for one domain.
      parameters:
      - name: id
        in: query
        schema:
          type: integer
      - name: domain
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          maximum: 200
          default: 50
      responses:
        '200':
          description: A scan, or { scans }.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityScan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: getSecurityPassive
    delete:
      tags:
      - Passive checks
      summary: Delete a passive check
      description: Needs the `write` scope.
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: deleteSecurityPassive
  /api/security/watches:
    get:
      tags:
      - Watched domains
      summary: List watched domains
      description: Needs the `read` scope. Returns { watches, limit, intervals }.
      responses:
        '200':
          description: The workspace's watched domains.
          content:
            application/json:
              schema:
                type: object
                properties:
                  watches:
                    type: array
                    items:
                      $ref: '#/components/schemas/SecurityWatch'
                  limit:
                    type: integer
                  intervals:
                    type: array
                    items:
                      type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: getSecurityWatches
    post:
      tags:
      - Watched domains
      summary: Watch a domain, or change a watch
      description: Needs the `write` scope. A watched domain's passive check re-runs every interval_hours (6, 24, or 168). It alerts by email
        and on channels subscribed to `security` when the grade drops or a new high-severity issue appears.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: Set to change an existing watch.
                kind:
                  type: string
                  enum:
                  - passive
                  - surface
                  default: passive
                  description: surface schedules attack surface scans; the domain must be verified, and the interval is 24 or 168 hours (168 by
                    default).
                domain:
                  type: string
                  example: example.com
                interval_hours:
                  type: integer
                  enum:
                  - 6
                  - 24
                  - 168
                  default: 24
                notify_email:
                  type: string
                enabled:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityWatch'
        '201':
          description: Watching.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityWatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: postSecurityWatches
    delete:
      tags:
      - Watched domains
      summary: Stop watching a domain
      description: Needs the `write` scope. Past scans stay.
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Stopped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: deleteSecurityWatches
  /api/security/surface:
    post:
      tags:
      - Attack surface
      summary: Start an attack surface scan of a verified domain
      description: Needs the `probe` scope. The domain, or the domain it is under, must be verified in Assets. Answers 202 with a running scan;
        poll GET ?id= until status is done or failed. One scan at a time per workspace; Free 2, Pro 10, Enterprise 50 an hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - domain
              properties:
                domain:
                  type: string
                  example: example.com
      responses:
        '202':
          description: The scan
          running.: null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityScan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
      operationId: postSecuritySurface
    get:
      tags:
      - Attack surface
      summary: List attack surface scans, or get one
      description: 'Needs the `read` scope. With id, the scan with its report: hosts (name, source, addresses, open_ports, certificate) and findings,
        each naming its host.'
      parameters:
      - name: id
        in: query
        schema:
          type: integer
      - name: limit
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: A scan, or { scans }.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scans:
                    type: array
                    items:
                      $ref: '#/components/schemas/SecurityScan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: getSecuritySurface
    delete:
      tags:
      - Attack surface
      summary: Delete an attack surface scan
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: deleteSecuritySurface
  /api/hosts:
    get:
      tags:
      - Hosts
      summary: List hosts, or one host's history
      description: 'Needs the `read` scope. Without `id`, lists enrolled agents with their machine description and newest sample (CPU, load, memory,
        swap, disks, network, processes, uptime). With `id` and `range` (1h, 6h, 24h, 7d, 14d), returns averaged points: cpu, cpu_max, load1,
        mem_pct, swap_pct, disk_pct (fullest disk), net_rx_bps, net_tx_bps, procs.'
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: integer
      - name: range
        in: query
        required: false
        schema:
          type: string
          enum:
          - 1h
          - 6h
          - 24h
          - 7d
          - 14d
      responses:
        '200':
          description: '{ hosts, metrics_seconds } or { points, range, bucket_seconds }'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    hosts:
                      type: array
                      items:
                        $ref: '#/components/schemas/Host'
                    metrics_seconds:
                      type: integer
                - type: object
                  properties:
                    points:
                      type: array
                      items:
                        $ref: '#/components/schemas/HostPoint'
                    range:
                      type: string
                    bucket_seconds:
                      type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: getHosts
  /api/hosts/alerts:
    get:
      tags:
      - Host alerts
      summary: List host alert rules and where they fire
      responses:
        '200':
          description: '{ rules, limit }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules:
                    type: array
                    items:
                      $ref: '#/components/schemas/HostAlertRule'
                  limit:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: getHostsAlerts
    post:
      tags:
      - Host alerts
      summary: Create or update a host alert rule
      description: Needs the `write` scope. Fires when every sample in the last `minutes` is at or above `threshold` percent; clears when every
        sample is below.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - metric
              - threshold
              - minutes
              properties:
                id:
                  type: integer
                  description: Omit to create.
                agent_id:
                  type: integer
                  nullable: true
                  description: Null for every host.
                metric:
                  type: string
                  enum:
                  - cpu
                  - memory
                  - disk
                  - swap
                threshold:
                  type: number
                  minimum: 1
                  maximum: 100
                minutes:
                  type: integer
                  minimum: 1
                  maximum: 60
                notify_email:
                  type: string
                enabled:
                  type: boolean
      responses:
        '200':
          description: The updated rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostAlertRule'
        '201':
          description: The new rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostAlertRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: postHostsAlerts
    delete:
      tags:
      - Host alerts
      summary: Delete a host alert rule
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: deleteHostsAlerts
  /api/devices:
    get:
      tags:
      - Network devices
      summary: List network devices, or one device's history
      description: Needs the `read` scope. Without `id`, lists devices with status, system info, and interfaces (credentials are never returned).
        With `id` and `range` (1h, 6h, 24h, 7d), returns traffic points; add `if` for one interface.
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: integer
      - name: range
        in: query
        required: false
        schema:
          type: string
          enum:
          - 1h
          - 6h
          - 24h
          - 7d
      - name: if
        in: query
        required: false
        schema:
          type: integer
        description: Interface index.
      responses:
        '200':
          description: '{ devices, limit } or { points, range, bucket_seconds }'
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    devices:
                      type: array
                      items:
                        $ref: '#/components/schemas/NetworkDevice'
                    limit:
                      type: integer
                - type: object
                  properties:
                    points:
                      type: array
                      items:
                        $ref: '#/components/schemas/TrafficPoint'
                    range:
                      type: string
                    bucket_seconds:
                      type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: getDevices
    post:
      tags:
      - Network devices
      summary: Add or update a network device
      description: Needs the `write` scope and an owner or admin. Give `community` for v2c, or `username`, `auth_protocol` (none, md5, sha, sha256,
        sha512), `auth_password`, `priv_protocol` (none, des, aes, aes256), `priv_password` for v3. On update, leave credentials out to keep them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - address
              - version
              properties:
                id:
                  type: integer
                agent_id:
                  type: integer
                  nullable: true
                name:
                  type: string
                address:
                  type: string
                  example: 10.0.0.2
                port:
                  type: integer
                  default: 161
                version:
                  type: string
                  enum:
                  - 2c
                  - '3'
                interval_seconds:
                  type: integer
                  minimum: 30
                  maximum: 3600
                enabled:
                  type: boolean
      responses:
        '200':
          description: The updated device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkDevice'
        '201':
          description: The new device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkDevice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: postDevices
    delete:
      tags:
      - Network devices
      summary: Remove a network device and its history
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: deleteDevices
  /api/security/compliance:
    get:
      tags:
      - Compliance
      summary: Map scan results to compliance controls
      description: Needs the `read` scope. Evaluates externally observable controls from each domain's newest passive, attack surface, and deep
        scan of the last 30 days, plus verified domains, schedules, and monitors. Each control has a status (pass, warn, fail, not_assessed),
        evidence, and references to CIS Controls v8, PCI DSS 4.0, ISO/IEC 27001:2022 Annex A, and SOC 2. Evidence for an audit, not a certification.
      parameters:
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
          - csv
        description: csv returns the same as a spreadsheet.
      responses:
        '200':
          description: '{ frameworks, controls, counts, sources, window_days, checked_at }, or text/csv'
          content:
            application/json:
              schema:
                type: object
                properties:
                  frameworks:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        short:
                          type: string
                        mapped:
                          type: integer
                        assessed:
                          type: integer
                        passing:
                          type: integer
                        warning:
                          type: integer
                        failing:
                          type: integer
                        not_assessed:
                          type: integer
                        percent:
                          type: integer
                  controls:
                    type: array
                    items:
                      $ref: '#/components/schemas/ComplianceControl'
                  counts:
                    type: object
                    additionalProperties:
                      type: integer
                  window_days:
                    type: integer
                  checked_at:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: getSecurityCompliance
  /api/security/vulnerabilities:
    get:
      tags:
      - Vulnerabilities
      summary: List known vulnerabilities across verified domains
      description: 'Needs the `read` scope. From each domain''s latest attack surface scan: CVE, severity (critical/high/medium/low), CVSS, kev
        (exploited in the wild), epss, host, port, product, version, and the workspace''s decision if any. Matched from announced versions, so
        distributions'' backported fixes show as false positives.'
      responses:
        '200':
          description: '{ vulns, domains }'
          content:
            application/json:
              schema:
                type: object
                properties:
                  vulns:
                    type: array
                    items:
                      $ref: '#/components/schemas/Vulnerability'
                  domains:
                    type: array
                    items:
                      type: object
                      properties:
                        domain:
                          type: string
                        scan_id:
                          type: integer
                          format: int64
                        scanned_at:
                          type: string
                          format: date-time
                        vuln_error:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: getSecurityVulnerabilities
  /api/security/vulnerabilities/decisions:
    post:
      tags:
      - Vulnerabilities
      summary: Accept a risk or mark a false positive
      description: Needs the `write` scope and an owner or admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - host
              - cve
              - status
              properties:
                host:
                  type: string
                cve:
                  type: string
                  example: CVE-2021-23017
                status:
                  type: string
                  enum:
                  - accepted
                  - false_positive
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: The decision.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  host:
                    type: string
                  cve:
                    type: string
                  status:
                    type: string
                  reason:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: postSecurityVulnerabilitiesDecisions
    delete:
      tags:
      - Vulnerabilities
      summary: Reopen a vulnerability
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Reopened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: deleteSecurityVulnerabilitiesDecisions
  /api/security/deep:
    get:
      tags:
      - Deep scans
      summary: List deep scan requests
      description: Needs the `read` scope. Returns { requests, per_month, windows, checks }.
      responses:
        '200':
          description: The workspace's requests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeepScanRequest'
                  per_month:
                    type: integer
                  windows:
                    type: array
                    items:
                      type: integer
                  checks:
                    type: object
                    additionalProperties:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: getSecurityDeep
    post:
      tags:
      - Deep scans
      summary: Preview or submit a signed deep scan request
      description: 'Needs the `write` scope, an owner or admin, and a Pro or Enterprise plan. With ?preview=1, returns the authorization text
        and its SHA-256 for the given scope and name. Without it, submits: send the same fields plus consent_hash and accept=true; the server
        rebuilds the text and refuses a different hash. The request waits for a Qnetward admin''s approval and runs only inside its window.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - domain
              - window_hours
              - name
              properties:
                domain:
                  type: string
                hosts:
                  type: array
                  items:
                    type: string
                  maxItems: 20
                checks:
                  type: array
                  items:
                    type: string
                    enum:
                    - exposed_files
                window_start:
                  type: string
                  format: date-time
                window_hours:
                  type: integer
                  enum:
                  - 24
                  - 72
                  - 168
                name:
                  type: string
                  description: The signer's full name.
                consent_hash:
                  type: string
                accept:
                  type: boolean
      responses:
        '200':
          description: 'Preview: { text, hash, version, input }.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepScanRequest'
        '201':
          description: The request
          pending review.: null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepScanRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: postSecurityDeep
    delete:
      tags:
      - Deep scans
      summary: Withdraw a request that hasn't started
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepScanRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: deleteSecurityDeep
  /api/assets/domains:
