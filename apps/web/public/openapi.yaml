components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: A workspace API key, beginning with `qnw_`.
  responses:
    Error:
      description: The request failed.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    Report:
      description: The run's results and summary.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Report'
    BadRequest:
      description: The request is malformed or a value is out of range.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: port must be between 1 and 65535
    Unauthorized:
      description: No API key, or the key is wrong or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: authentication required
    Forbidden:
      description: The key lacks the scope, or your role can't do this.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: this API key does not have the write scope
    NotFound:
      description: Nothing with that id in this workspace.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: not found
    Conflict:
      description: A plan limit is reached, or the change conflicts with the current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: this plan's network device limit is reached
    TooManyRequests:
      description: Slow down. `Retry-After` says how many seconds to wait.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: too many requests
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait.
