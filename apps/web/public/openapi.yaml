      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: deleteAssetsDomains
  /api/assets/domains/verify:
    post:
      tags:
      - Domains
      summary: Look for a domain's proof now
      description: Needs the `write` scope and an owner or admin. 60 attempts a workspace per hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              properties:
                id:
                  type: integer
      responses:
        '200':
          description: The domain; status is verified when the proof was found, with last_error saying what was seen when not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiedDomain'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/Error'
      operationId: postAssetsDomainsVerify
